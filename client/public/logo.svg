<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Glowing Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="cyanBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.6" filter="url(#cyanBlur)" />

  <!-- Cyber Grid Circuit Matrix in Background -->
  <path d="M60 256 H140 M372 256 H452 M256 60 V120 M256 392 V452" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" />
  <circle cx="140" cy="256" r="5" fill="#06b6d4" fill-opacity="0.5" />
  <circle cx="372" cy="256" r="5" fill="#06b6d4" fill-opacity="0.5" />
  <circle cx="256" cy="120" r="5" fill="#06b6d4" fill-opacity="0.5" />
  <circle cx="256" cy="392" r="5" fill="#06b6d4" fill-opacity="0.5" />

  <!-- Detective Fedora Hat Silhouette -->
  <path d="M120 200 C120 190, 160 185, 256 185 C352 185, 392 190, 392 200 C392 208, 350 216, 256 216 C162 216, 120 208, 120 200 Z" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="5" />
  <path d="M172 190 L195 125 C200 110, 220 100, 256 100 C292 100, 312 110, 317 125 L340 190 Z" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="5" stroke-linejoin="round" />
  <!-- Hat Ribbon with Neon Cyan Accent -->
  <path d="M182 170 C205 174, 256 176, 256 176 C256 176, 307 174, 330 170 L334 182 C310 187, 256 189, 256 189 C256 189, 202 187, 178 182 Z" fill="url(#cyanGrad)" filter="url(#cyanBlur)" />

  <!-- Cyber Detective Glasses / Visor HUD -->
  <g filter="url(#intenseGlow)">
    <!-- Visor Bridge -->
    <path d="M236 250 H276" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left Lens -->
    <path d="M152 236 H228 C234 236, 240 242, 238 248 L226 290 C223 298, 215 304, 206 304 H162 C152 304, 144 296, 142 286 L140 248 C139 241, 145 236, 152 236 Z" fill="#030712" stroke="#22d3ee" stroke-width="7" />
    <!-- Left Lens Glow Core & HUD Scanlines -->
    <path d="M156 248 H222" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="188" cy="270" r="10" fill="#22d3ee" filter="url(#cyanBlur)" />
    <circle cx="188" cy="270" r="4" fill="#ffffff" />
    
    <!-- Right Lens -->
    <path d="M284 236 H360 C367 236, 373 241, 372 248 L370 286 C368 296, 360 304, 350 304 H306 C297 304, 289 298, 286 290 L274 248 C272 242, 278 236, 284 236 Z" fill="#030712" stroke="#22d3ee" stroke-width="7" />
    <!-- Right Lens Glow Core & HUD Scanlines -->
    <path d="M290 248 H356" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="324" cy="270" r="10" fill="#22d3ee" filter="url(#cyanBlur)" />
    <circle cx="324" cy="270" r="4" fill="#ffffff" />
  </g>

  <!-- Stylized Geometric "W" Monogram (What's The Word) -->
  <g filter="url(#cyanBlur)">
    <path d="M170 340 L205 410 L256 360 L307 410 L342 340" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Rose/Ruby Impostor Dot Indicator -->
    <circle cx="256" cy="360" r="6" fill="url(#roseAccent)" />
  </g>

  <!-- Four Corner Cyber Crosshairs -->
  <path d="M70 100 V70 H100 M442 100 V70 H412 M70 412 V442 H100 M442 412 V442 H412" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
</svg>